<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔羅後台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0d0d1a;color:#e0d7f5;min-height:100vh}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at center,#1a0a2e 0%,#0d0d1a 70%)}
.login-box{background:rgba(255,255,255,0.04);border:1px solid rgba(180,130,255,0.2);border-radius:20px;padding:48px 40px;width:360px;text-align:center;backdrop-filter:blur(12px);box-shadow:0 0 60px rgba(140,80,255,0.15)}
.login-box .moon{font-size:52px;margin-bottom:16px}
.login-box h1{font-size:22px;color:#c8a8ff;margin-bottom:8px}
.login-box p{font-size:13px;color:#8a7aaa;margin-bottom:32px}
.login-box input{width:100%;padding:14px 18px;border-radius:10px;border:1px solid rgba(180,130,255,0.3);background:rgba(255,255,255,0.05);color:#e0d7f5;font-size:15px;margin-bottom:16px;outline:none;transition:border .3s}
.login-box input:focus{border-color:#a070ff}
.login-box button{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.login-box button:hover{opacity:.85}
.login-error{color:#ff6b9d;font-size:13px;margin-top:10px;display:none}
#adminApp{display:none}
header{background:rgba(20,10,40,0.95);border-bottom:1px solid rgba(180,130,255,0.15);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
header .logo{font-size:18px;color:#c8a8ff;font-weight:600}
header .logo span{color:#a855f7}
.header-actions{display:flex;gap:10px;align-items:center}
.btn-sm{padding:7px 16px;border-radius:8px;border:1px solid rgba(180,130,255,0.3);background:transparent;color:#c8a8ff;font-size:13px;cursor:pointer;transition:all .2s}
.btn-sm:hover{background:rgba(168,85,247,0.15)}
.btn-sm.danger{border-color:rgba(255,100,100,0.3);color:#ff8888}
.btn-sm.danger:hover{background:rgba(255,80,80,0.1)}
.main-container{max-width:960px;margin:32px auto;padding:0 20px}
.section-card{background:rgba(255,255,255,0.03);border:1px solid rgba(180,130,255,0.12);border-radius:16px;padding:28px;margin-bottom:24px}
.section-title{font-size:13px;color:#a070ff;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';display:inline-block;width:3px;height:14px;background:#a855f7;border-radius:2px}
.row-flex{display:flex;gap:16px;flex-wrap:wrap}
.form-group{flex:1;min-width:200px}
.form-group label{display:block;font-size:12px;color:#8a7aaa;margin-bottom:8px;letter-spacing:1px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(180,130,255,0.2);background:rgba(255,255,255,0.04);color:#e0d7f5;font-size:14px;outline:none;transition:border .3s;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#a070ff}
.form-group textarea{resize:vertical;min-height:100px;line-height:1.7}
.form-group select option{background:#1a0a2e}
.count-btns{display:flex;gap:8px;flex-wrap:wrap}
.count-btn{width:44px;height:44px;border-radius:10px;border:1px solid rgba(180,130,255,0.25);background:transparent;color:#c8a8ff;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s}
.count-btn:hover{border-color:#a855f7;background:rgba(168,85,247,0.1)}
.count-btn.active{background:#7c3aed;border-color:#7c3aed;color:white}
#cardsContainer{display:flex;flex-direction:column;gap:20px}
.card-config{background:rgba(255,255,255,0.03);border:1px solid rgba(180,130,255,0.1);border-radius:14px;padding:20px}
.card-config-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-num-badge{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white;flex-shrink:0}
.card-config-title{font-size:15px;color:#c8a8ff;font-weight:600}
.image-upload-area{border:2px dashed rgba(180,130,255,0.2);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:all .3s;margin-bottom:14px;position:relative;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
.image-upload-area:hover{border-color:#a855f7;background:rgba(168,85,247,0.05)}
.image-upload-area.has-image{border-style:solid;border-color:rgba(168,85,247,0.4)}
.image-upload-area img{max-height:140px;border-radius:8px;object-fit:contain}
.upload-hint{color:#6a5a8a;font-size:13px}
.upload-icon{font-size:28px;margin-bottom:8px}
.image-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-remove-btn{position:absolute;top:8px;right:8px;background:rgba(255,80,80,0.8);border:none;color:white;border-radius:50%;width:26px;height:26px;font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:2;line-height:1}
.image-upload-area.has-image .img-remove-btn{display:flex}
.card-search-wrapper{position:relative;margin-bottom:14px}
.card-search-wrapper .search-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#6a5a8a;pointer-events:none}
.card-dropdown{position:absolute;top:100%;left:0;right:0;background:#1a0a2e;border:1px solid rgba(180,130,255,0.2);border-radius:10px;max-height:200px;overflow-y:auto;z-index:50;display:none;margin-top:4px}
.card-dropdown.open{display:block}
.card-dropdown-item{padding:10px 14px;cursor:pointer;font-size:13px;color:#c8a8ff;transition:background .15s;border-bottom:1px solid rgba(180,130,255,0.05)}
.card-dropdown-item:hover{background:rgba(168,85,247,0.15)}
.card-item-sub{font-size:11px;color:#6a5a8a}
.save-btn{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:16px;font-weight:700;cursor:pointer;transition:all .3s;letter-spacing:1px;box-shadow:0 4px 20px rgba(120,60,237,0.3)}
.save-btn:hover{opacity:.9;transform:translateY(-1px)}
.save-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:999;opacity:0;transform:translateY(20px);transition:all .4s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#1a3a2a;border:1px solid #3a7a5a;color:#6af0a0}
.toast.error{background:#3a1a2a;border:1px solid #7a3a5a;color:#f06090}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(180,130,255,0.08);cursor:pointer;transition:all .2s}
.history-item:hover{border-color:rgba(180,130,255,0.25);background:rgba(168,85,247,0.05)}
.history-item .date-label{font-size:14px;color:#c8a8ff}
.history-item .card-count{font-size:12px;color:#6a5a8a}
.history-item .del-btn{background:none;border:none;color:#6a5a8a;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:6px;transition:all .2s}
.history-item .del-btn:hover{color:#ff8888;background:rgba(255,80,80,0.1)}
.change-pwd-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.change-pwd-form .form-group{flex:1;min-width:150px}
.change-pwd-form button{padding:12px 20px;border-radius:10px;border:1px solid rgba(180,130,255,0.3);background:transparent;color:#c8a8ff;font-size:14px;cursor:pointer;white-space:nowrap;transition:all .2s;margin-bottom:0}
.change-pwd-form button:hover{background:rgba(168,85,247,0.15)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.online{background:#4ade80;box-shadow:0 0 6px #4ade80}
@media(max-width:600px){.main-container{padding:0 12px;margin:16px auto}.section-card{padding:18px}.row-flex{flex-direction:column}}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="moon">🌙</div>
    <h1>塔羅後台管理</h1>
    <p>請輸入管理者密碼進入後台</p>
    <input type="password" id="pwdInput" placeholder="管理者密碼" onkeydown="if(event.key==='Enter')doLogin()" />
    <button onclick="doLogin()">進入後台</button>
    <div class="login-error" id="loginError">密碼錯誤，請重試</div>
  </div>
</div>

<div id="adminApp">
  <header>
    <div class="logo">🔮 <span>每日塔羅</span> 後台管理</div>
    <div class="header-actions">
      <span style="font-size:12px;color:#6a5a8a"><span class="status-dot online"></span>Firebase 已連線</span>
      <button class="btn-sm" onclick="toggleChangePwd()">變更密碼</button>
      <button class="btn-sm danger" onclick="doLogout()">登出</button>
    </div>
  </header>

  <div class="main-container">

    <div class="section-card">
      <div class="section-title">今日牌陣設定</div>
      <div class="row-flex" style="margin-bottom:20px">
        <div class="form-group">
          abel>📅 日期</label>
          <input type="date" id="dateInput" />
        </div>
        <div class="form-group">
          abel>🃏 今日抽牌張數</label>
          <div class="count-btns" id="countBtns">
            <button class="count-btn" onclick="setCount(1)">1</button>
            <button class="count-btn" onclick="setCount(2)">2</button>
            <button class="count-btn active" onclick="setCount(3)">3</button>
            <button class="count-btn" onclick="setCount(4)">4</button>
            <button class="count-btn" onclick="setCount(5)">5</button>
          </div>
        </div>
      </div>
      <div id="cardsContainer"></div>
    </div>

    <div class="section-card">
      <div class="section-title">前台品牌設定</div>
      <div class="row-flex">
        <div class="form-group">
          abel>前台標題</label>
          <input type="text" id="brandTitle" value="每日塔羅占卜" />
        </div>
        <div class="form-group">
          abel>副標語</label>
          <input type="text" id="brandSubtitle" value="今日星盤為你揭示命運的訊息" />
        </div>
      </div>
      <div class="row-flex" style="margin-top:14px">
        <div class="form-group">
          abel>預約按鈕文字</label>
          <input type="text" id="bookingText" value="預約一對一占卜" />
        </div>
        <div class="form-group">
          abel>預約連結（LINE / IG / 表單）</label>
          <input type="url" id="bookingUrl" placeholder="https://line.me/..." />
        </div>
      </div>
      <div class="row-flex" style="margin-top:14px">
        <div class="form-group">
          abel>結果頁底部提示語</label>
          <input type="text" id="footerHint" value="想深入了解你的命盤？歡迎預約一對一占卜" />
        </div>
      </div>
    </div>

    <button class="save-btn" onclick="saveToday()" id="saveBtn">✨ 儲存今日牌陣到雲端</button>

    <div class="section-card" style="margin-top:24px">
      <div class="section-title">已儲存的日期記錄</div>
      <div class="history-list" id="historyList"><div style="color:#6a5a8a;font-size:13px">載入中...</div></div>
    </div>

    <div class="section-card" id="changePwdSection" style="display:none">
      <div class="section-title">變更管理者密碼</div>
      <div class="change-pwd-form">
        <div class="form-group">abel>舊密碼</label><input type="password" id="oldPwd" /></div>
        <div class="form-group">abel>新密碼</label><input type="password" id="newPwd" /></div>
        <div class="form-group">abel>確認新密碼</label><input type="password" id="confirmPwd" /></div>
        <button onclick="changePwd()">確認變更</button>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">

  appId: "1:333886765161:web:3a037dd5559b2b06204af8"

const db = getFirestore(app);
