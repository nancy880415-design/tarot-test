<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔羅後台管理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0d0d1a;color:#e0d7f5;min-height:100vh}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at center,#1a0a2e 0%,#0d0d1a 70%)}
.login-box{background:rgba(255,255,255,0.04);border:1px solid rgba(180,130,255,0.2);border-radius:20px;padding:48px 40px;width:360px;text-align:center;backdrop-filter:blur(12px);box-shadow:0 0 60px rgba(140,80,255,0.15)}
.moon{font-size:52px;margin-bottom:16px}
.login-box h1{font-size:22px;color:#c8a8ff;margin-bottom:8px}
.login-box p{font-size:13px;color:#8a7aaa;margin-bottom:32px}
.login-box input{width:100%;padding:14px 18px;border-radius:10px;border:1px solid rgba(180,130,255,0.3);background:rgba(255,255,255,0.05);color:#e0d7f5;font-size:15px;margin-bottom:16px;outline:none}
.loginbtn{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:15px;font-weight:600;cursor:pointer}
.login-error{color:#ff6b9d;font-size:13px;margin-top:10px;display:none}
#adminApp{display:none}
header{background:rgba(20,10,40,0.95);border-bottom:1px solid rgba(180,130,255,0.15);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-size:18px;color:#c8a8ff;font-weight:600}
.logo span{color:#a855f7}
.header-actions{display:flex;gap:10px;align-items:center}
.btn-sm{padding:7px 16px;border-radius:8px;border:1px solid rgba(180,130,255,0.3);background:transparent;color:#c8a8ff;font-size:13px;cursor:pointer}
.btn-sm.danger{border-color:rgba(255,100,100,0.3);color:#ff8888}
.main-container{max-width:960px;margin:32px auto;padding:0 20px}
.section-card{background:rgba(255,255,255,0.03);border:1px solid rgba(180,130,255,0.12);border-radius:16px;padding:28px;margin-bottom:24px}
.section-title{font-size:13px;color:#a070ff;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
.row-flex{display:flex;gap:16px;flex-wrap:wrap}
.form-group{flex:1;min-width:200px;margin-bottom:4px}
.form-group label{display:block;font-size:12px;color:#8a7aaa;margin-bottom:8px;letter-spacing:1px}
.form-group input,.form-group textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(180,130,255,0.2);background:rgba(255,255,255,0.04);color:#e0d7f5;font-size:14px;outline:none;font-family:inherit}
.form-group textarea{resize:vertical;min-height:100px;line-height:1.7}
.count-btns{display:flex;gap:8px}
.count-btn{width:44px;height:44px;border-radius:10px;border:1px solid rgba(180,130,255,0.25);background:transparent;color:#c8a8ff;font-size:16px;font-weight:600;cursor:pointer}
.count-btn.active{background:#7c3aed;border-color:#7c3aed;color:white}
#cardsContainer{display:flex;flex-direction:column;gap:20px;margin-top:20px}
.card-config{background:rgba(255,255,255,0.03);border:1px solid rgba(180,130,255,0.1);border-radius:14px;padding:20px}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-badge{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white}
.card-title-label{font-size:15px;color:#c8a8ff;font-weight:600}
.upload-area{border:2px dashed rgba(180,130,255,0.2);border-radius:12px;padding:20px;text-align:center;cursor:pointer;margin-bottom:14px;position:relative;min-height:100px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.upload-area.has-img{border-style:solid;border-color:rgba(168,85,247,0.4)}
.upload-area img{max-height:120px;border-radius:8px;object-fit:contain}
.upload-hint{color:#6a5a8a;font-size:13px}
.upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.remove-img{position:absolute;top:8px;right:8px;background:rgba(255,80,80,0.8);border:none;color:white;border-radius:50%;width:26px;height:26px;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:16px;z-index:2}
.upload-area.has-img .remove-img{display:flex}
.card-search{position:relative;margin-bottom:14px}
.card-search input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(180,130,255,0.2);background:rgba(255,255,255,0.04);color:#e0d7f5;font-size:14px;outline:none;font-family:inherit}
.dropdown{position:absolute;top:100%;left:0;right:0;background:#1a0a2e;border:1px solid rgba(180,130,255,0.2);border-radius:10px;max-height:200px;overflow-y:auto;z-index:50;display:none;margin-top:4px}
.dropdown.open{display:block}
.dropdown-item{padding:10px 14px;cursor:pointer;font-size:13px;color:#c8a8ff;border-bottom:1px solid rgba(180,130,255,0.05)}
.dropdown-item:hover{background:rgba(168,85,247,0.15)}
.dropdown-item small{font-size:11px;color:#6a5a8a;display:block}
.save-btn{width:100%;padding:16px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:white;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 20px rgba(120,60,237,0.3)}
.save-btn:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:999;opacity:0;transform:translateY(20px);transition:all .4s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#1a3a2a;border:1px solid #3a7a5a;color:#6af0a0}
.toast.error{background:#3a1a2a;border:1px solid #7a3a5a;color:#f06090}
.history-list{display:flex;flex-direction:column;gap:8px}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(180,130,255,0.08);cursor:pointer}
.history-item:hover{border-color:rgba(180,130,255,0.25);background:rgba(168,85,247,0.05)}
.history-date{font-size:14px;color:#c8a8ff}
.history-count{font-size:12px;color:#6a5a8a}
.del-btn{background:none;border:none;color:#6a5a8a;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:6px}
.del-btn:hover{color:#ff8888;background:rgba(255,80,80,0.1)}
@media(max-width:600px){.main-container{padding:0 12px;margin:16px auto}.section-card{padding:18px}.row-flex{flex-direction:column}}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-box">
    <div class="moon">🌙</div>
    <h1>塔羅後台管理</h1>
    <p>請輸入管理者密碼</p>
    <input type="password" id="pwdInput" placeholder="管理者密碼" />
    <button class="loginbtn" id="loginBtn">進入後台</button>
    <div class="login-error" id="loginError">密碼錯誤，請重試</div>
  </div>
</div>
<div id="adminApp">

    <div class="logo">🔮 <span>每日塔羅</span> 後台</div>
    <div class="header-actions">
      <span style="font-size:12px;color:#4ade80">● Firebase 連線中</span>
      <button class="btn-sm danger" id="logoutBtn">登出</button>
    </div>
  </header>
  <div class="main-container">
    <div class="section-card">
      <div class="section-title">📅 今日牌陣設定</div>
      <div class="row-flex" style="margin-bottom:20px">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="dateInput" />
        </div>
        <div class="form-group">
          <label>抽牌張數</label>
          <div class="count-btns" id="countBtns">
            <button class="count-btn" data-n="1">1</button>
            <button class="count-btn" data-n="2">2</button>
            <button class="count-btn active" data-n="3">3</button>
            <button class="count-btn" data-n="4">4</button>
            <button class="count-btn" data-n="5">5</button>
          </div>
        </div>
      </div>
      <div id="cardsContainer"></div>
    </div>
    <div class="section-card">
      <div class="section-title">🎨 前台品牌設定</div>
      <div class="row-flex">
        <div class="form-group"><label>前台標題</label><input type="text" id="brandTitle" value="每日塔羅占卜" /></div>
        <div class="form-group"><label>副標語</label><input type="text" id="brandSubtitle" value="今日星盤為你揭示命運的訊息" /></div>
      </div>
      <div class="row-flex" style="margin-top:14px">
        <div class="form-group"><label>預約按鈕文字</label><input type="text" id="bookingText" value="預約一對一占卜" /></div>
        <div class="form-group"><label>預約連結</label><input type="url" id="bookingUrl" placeholder="https://line.me/..." /></div>
      </div>
      <div class="row-flex" style="margin-top:14px">
        <div class="form-group"><label>底部提示語</label><input type="text" id="footerHint" value="想深入了解你的命盤？歡迎預約一對一占卜" /></div>
      </div>
    </div>
    <button class="save-btn" id="saveBtn">✨ 儲存今日牌陣到雲端</button>
    <div class="section-card" style="margin-top:24px">
      <div class="section-title">📋 已儲存記錄</div>
      <div class="history-list" id="historyList"><div style="color:#6a5a8a;font-size:13px;padding:12px">載入中...</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

function doLogin(){
  const val = document.getElementById('pwdInput').value;
  if(val === ADMIN_PWD){
    sessionStorage.setItem('adminLoggedIn','1');

  const dateStr = today.toISOString().split('T')[0];
  document.getElementById('dateInput').value = dateStr;
  document.querySelectorAll('.count-btn').forEach(btn=>{
    btn.onclick = ()=>{ cardCount=parseInt(btn.dataset.n); setActiveCount(cardCount); renderCards(); };

  renderCards();
  loadHistory();
  document.getElementById('saveBtn').onclick = saveToday;

function setActiveCount(n){
  document.querySelectorAll('.count-btn').forEach(b=>{
    b.classList.toggle('active', parseInt(b.dataset.n)===n);
  });
}

// 渲染牌卡設定區
function renderCards(){
  const container = document.getElementById('cardsContainer');
  container.innerHTML='';
  for(let i=0;iardCount;i++){
    const div=document.createElement('div');
    div.className='card-config';
    div.innerHTML=`
      <div class="card-header">
        <div class="card-badge">${i+1}</div>
        <div class="card-title-label">第 ${i+1} 張牌</div>
      </div>
      <div class="upload-area ${cardImages[i]?'has-img':''}" id="uploadArea${i}">
        <button class="remove-img" onclick="removeImg(${i},event)">✕</button>
        ${cardImages[i]?`<img src="${cardImages[i]}" id="previewImg${i}"/>`:`<div><div style="font-size:28px;margin-bottom:8px">🖼️</div><div class="upload-hint">點擊上傳牌面圖片（可略過）</div></div>`}
        <input type="file" accept="image/*" onchange="handleImg(${i},this)"/>
      </div>
      <div class="card-search">
        <input type="text" placeholder="搜尋牌名..." id="searchInput${i}" oninput="searchCard(${i})" onfocus="openDropdown(${i})" autocomplete="off"/>
        <div class="dropdown" id="dropdown${i}"></div>
      </div>
      <div class="form-group" style="margin-bottom:14px">
        abel>牌面標題（給使用者看）</label>
        <input type="text" id="cardTitle${i}" placeholder="例：今日能量 - 星星"/>
      </div>
      <div class="form-group" style="margin-bottom:14px">
        abel>今日解說內容</label>
        <textarea id="cardContent${i}" placeholder="輸入今日的塔羅解說..."></textarea>
      </div>
      <div class="form-group">
        abel>小建議 / Tip</label>
        <input type="text" id="cardTip${i}" placeholder="例：今天適合靜心，避免衝動決定"/>
      </div>`;
    container.appendChild(div);
  }
  document.addEventListener('click', e=>{
    for(let i=0;iardCount;i++){
      const dd=document.getElementById(`dropdown${i}`);
      const inp=document.getElementById(`searchInput${i}`);
      if(dd && inp && !dd.contains(e.target) && e.target!==inp) dd.classList.remove('open');
    }
  });
}

window.removeImg = function(i, e){
  e.stopPropagation();
  cardImages[i]=null;
  renderCards();
};

window.handleImg = function(i, input){
  const file=input.files[0];
  if(!file) return;
  if(file.size>3*1024*1024){ showToast('圖片請小於 3MB','error'); return; }
  const reader=new FileReader();
  reader.onload=ev=>{ cardImages[i]=ev.target.result; renderCards(); };
  reader.readAsDataURL(file);
};

window.searchCard = function(i){
  const q=document.getElementById(`searchInput${i}`).value.toLowerCase();
  const dd=document.getElementById(`dropdown${i}`);
  const filtered=CARDS.filter(c=>c.name.includes(q)||c.en.toLowerCase().includes(q)||c.suit.includes(q));
  dd.innerHTML=filtered.slice(0,20).map(c=>`<div class="dropdown-item" onclick="selectCard(${i},'${c.name}','${c.en}','${c.suit}','${c.symbol}')">${c.name}<small>${c.en} · ${c.suit}</small></div>`).join('');
  dd.classList.add('open');
};

window.openDropdown = function(i){
  const q=document.getElementById(`searchInput${i}`).value;
  if(!q){ document.getElementById(`searchInput${i}`).dispatchEvent(new Event('input')); }
};

window.selectCard = function(i,name,en,suit,symbol){
  document.getElementById(`searchInput${i}`).value=name;
  document.getElementById(`searchInput${i}`).dataset.selected=JSON.stringify({name,en,suit,symbol});
  document.getElementById(`dropdown${i}`).classList.remove('open');
};

// 儲存
async function saveToday(){
  const date=document.getElementById('dateInput').value;
  if(!date){ showToast('請選擇日期','error'); return; }
  const cards=[];
  for(let i=0;iardCount;i++){
    const sel=document.getElementById(`searchInput${i}`).dataset.selected;
    const cardData=sel?JSON.parse(sel):{name:'塔羅牌',en:'Tarot',suit:'',symbol:'✦'};
    cards.push({
      cardName:cardData.name, cardEn:cardData.en, suit:cardData.suit, symbol:cardData.symbol,
      image:cardImages[i]||null,
      title:document.getElementById(`cardTitle${i}`).value,
      content:document.getElementById(`cardContent${i}`).value,
      tip:document.getElementById(`cardTip${i}`).value
    });
  }
  const brand={
    title:document.getElementById('brandTitle').value,
    subtitle:document.getElementById('brandSubtitle').value,
    bookingText:document.getElementById('bookingText').value,
    bookingUrl:document.getElementById('bookingUrl').value,
    footerHint:document.getElementById('footerHint').value
  };
  try{
    document.getElementById('saveBtn').disabled=true;
    document.getElementById('saveBtn').textContent='儲存中...';
    await setDoc(doc(db,'tarot',date),{cards,brand,updatedAt:new Date().toISOString()});
    showToast('✅ 今日牌陣已儲存到雲端！','success');
    loadHistory();
  } catch(e){
    showToast('❌ 儲存失敗：'+e.message,'error');
  } finally{
    document.getElementById('saveBtn').disabled=false;
    document.getElementById('saveBtn').textContent='✨ 儲存今日牌陣到雲端';
  }
}

// 載入歷史
async function loadHistory(){
  try{
    const snap=await getDocs(collection(db,'tarot'));
    const list=document.getElementById('historyList');
    if(snap.empty){ list.innerHTML='<div style="color:#6a5a8a;font-size:13px;padding:12px">尚無記錄</div>'; return; }
    const docs=[]; snap.forEach(d=>docs.push({id:d.id,...d.data()}));
    docs.sort((a,b)=>b.id.localeCompare(a.id));
    list.innerHTML=docs.map(d=>`
      <div class="history-item" onclick="loadDate('${d.id}')">
        <div><div class="history-date">📅 ${d.id}</div><div class="history-count">${d.cards?d.cards.length:0} 張牌</div></div>
        <button class="del-btn" onclick="delDate('${d.id}',event)">🗑</button>
      </div>`).join('');
  } catch(e){ console.error(e); }
}

window.loadDate = async function(dateId){
  const snap=await getDoc(doc(db,'tarot',dateId));
  if(!snap.exists()) return;
  const data=snap.data();
  document.getElementById('dateInput').value=dateId;
  cardCount=data.cards.length;
  setActiveCount(cardCount);
  cardImages={};
  data.cards.forEach((c,i)=>{ if(c.image) cardImages[i]=c.image; });
  renderCards();
  data.cards.forEach((c,i)=>{
    const inp=document.getElementById(`searchInput${i}`);
    if(inp){ inp.value=c.cardName; inp.dataset.selected=JSON.stringify({name:c.cardName,en:c.cardEn,suit:c.suit,symbol:c.symbol}); }
    const t=document.getElementById(`cardTitle${i}`); if(t) t.value=c.title||'';
    const ct=document.getElementById(`cardContent${i}`); if(ct) ct.value=c.content||'';
    const tip=document.getElementById(`cardTip${i}`); if(tip) tip.value=c.tip||'';
  });
  if(data.brand){
    document.getElementById('brandTitle').value=data.brand.title||'';
    document.getElementById('brandSubtitle').value=data.brand.subtitle||'';
    document.getElementById('bookingText').value=data.brand.bookingText||'';
    document.getElementById('bookingUrl').value=data.brand.bookingUrl||'';
    document.getElementById('footerHint').value=data.brand.footerHint||'';
  }
  showToast('已載入 '+dateId+' 的資料','success');
};

window.delDate = async function(dateId, e){
  e.stopPropagation();
  if(!confirm('確定刪除 '+dateId+' 的牌陣？')) return;
  await deleteDoc(doc(db,'tarot',dateId));
  showToast('已刪除','success');
  loadHistory();
};

// Toast
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3000);
}

// 自動登入檢查
if(sessionStorage.getItem('adminLoggedIn')==='1'){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('adminApp').style.display='block';
  init();
}
